<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KZAN-CHAT</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #05070d;
        color: white;
        height: 100vh;
        overflow: hidden;
    }

    .app {
        display: flex;
        height: 100vh;
    }

    /* BARRE LATÉRALE */
    .sidebar {
        width: 250px;
        background: #080b13;
        border-right: 1px solid #101b30;
        padding: 20px;
        display: flex;
        flex-direction: column;
    }

    .logo {
        font-size: 25px;
        font-weight: bold;
        color: #1597ff;
        text-shadow: 0 0 15px #006eff;
        margin-bottom: 30px;
    }

    .new-chat {
        background: #087fff;
        border: none;
        color: white;
        padding: 13px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
        transition: .2s;
    }

    .new-chat:hover {
        background: #0064d6;
        box-shadow: 0 0 20px #087fff55;
    }

    .info {
        margin-top: auto;
        color: #65738a;
        font-size: 12px;
        line-height: 1.6;
    }

    /* CHAT */
    .chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        background:
            radial-gradient(circle at 50% 0%, #06234a 0%, transparent 35%),
            #05070d;
    }

    .header {
        height: 65px;
        border-bottom: 1px solid #101b30;
        display: flex;
        align-items: center;
        padding: 0 25px;
        font-weight: bold;
    }

    .status {
        width: 9px;
        height: 9px;
        background: #00aaff;
        border-radius: 50%;
        margin-right: 10px;
        box-shadow: 0 0 10px #00aaff;
    }

    .messages {
        flex: 1;
        overflow-y: auto;
        padding: 30px;
    }

    .message {
        max-width: 800px;
        margin: 0 auto 20px;
        display: flex;
        gap: 12px;
    }

    .avatar {
        min-width: 38px;
        height: 38px;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
    }

    .user .avatar {
        background: #087fff;
    }

    .bot .avatar {
        background: #101b30;
        color: #1597ff;
        border: 1px solid #1597ff55;
    }

    .bubble {
        background: #0a0f1a;
        border: 1px solid #121f35;
        padding: 13px 16px;
        border-radius: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
    }

    .user .bubble {
        background: #087fff18;
        border-color: #087fff44;
    }

    /* ZONE DE SAISIE */
    .input-area {
        padding: 20px;
        border-top: 1px solid #101b30;
        background: #060912;
    }

    .input-box {
        max-width: 850px;
        margin: auto;
        display: flex;
        gap: 10px;
        background: #0b111e;
        border: 1px solid #172944;
        border-radius: 14px;
        padding: 8px;
        box-shadow: 0 0 25px #006eff10;
    }

    textarea {
        flex: 1;
        resize: none;
        border: none;
        outline: none;
        background: transparent;
        color: white;
        padding: 10px;
        font-size: 15px;
        min-height: 45px;
        max-height: 150px;
    }

    textarea::placeholder {
        color: #536176;
    }

    .send {
        width: 45px;
        height: 45px;
        border: none;
        border-radius: 10px;
        background: #087fff;
        color: white;
        cursor: pointer;
        font-size: 18px;
    }

    .send:hover {
        background: #0064d6;
        box-shadow: 0 0 15px #087fff88;
    }

    @media(max-width: 700px) {
        .sidebar {
            display: none;
        }

        .messages {
            padding: 15px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">⚡ KZAN-CHAT</div>

        <button class="new-chat" onclick="newChat()">
            + Nouvelle conversation
        </button>

        <div class="info">
            KZAN-CHAT<br>
            Assistant IA<br><br>
            Interface expérimentale
        </div>
    </aside>

    <main class="chat">

        <header class="header">
            <span class="status"></span>
            KZAN-CHAT
        </header>

        <section class="messages" id="messages">

            <div class="message bot">
                <div class="avatar">K</div>
                <div class="bubble">
                    Salut 👋<br>
                    Je suis KZAN-CHAT. Pose-moi une question pour commencer.
                </div>
            </div>

        </section>

        <div class="input-area">
            <div class="input-box">

                <textarea
                    id="input"
                    placeholder="Écris ton message..."
                    onkeydown="handleKey(event)"
                ></textarea>

                <button class="send" onclick="sendMessage()">
                    ➤
                </button>

            </div>
        </div>

    </main>
</div>

<script>

const messages = document.getElementById("messages");
const input = document.getElementById("input");

function addMessage(text, type) {

    const message = document.createElement("div");
    message.className = "message " + type;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = type === "user" ? "U" : "K";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    message.appendChild(avatar);
    message.appendChild(bubble);

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;
}

function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    // Simulation de réponse
    setTimeout(() => {

        const response =
            "Je suis actuellement en mode démonstration.\n\n" +
            "Pour transformer KZAN-CHAT en véritable IA, " +
            "il faut connecter cette interface à un modèle IA via un serveur sécurisé.";

        addMessage(response, "bot");

    }, 700);
}

function handleKey(event) {

    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

function newChat() {
    messages.innerHTML = "";

    addMessage(
        "Nouvelle conversation créée. 👋",
        "bot"
    );
}

</script>

</body>
</html>
